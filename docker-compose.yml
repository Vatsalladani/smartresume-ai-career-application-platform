services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_saas_db
    ports:
      - "5432:5432"
    volumes:
      - smartresume_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_saas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartresume_pg:
